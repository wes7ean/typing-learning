<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Learning</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f6fb; color: #1f2937; }
  header { background: #4f46e5; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 22px; }
  #hearts { font-size: 26px; letter-spacing: 4px; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #d1d5db; border-radius: 10px; }
  select { padding: 8px; font-size: 16px; border-radius: 8px; }
  button { background: #4f46e5; color: #fff; border: 0; padding: 12px 18px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 10px; margin-right: 8px; }
  button:hover { background: #4338ca; }
  button.sec { background: #6b7280; }
  .result { display: flex; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; align-items: center; }
  .result:hover { background: #eef2ff; }
  .result img { width: 120px; border-radius: 8px; }
  #player { width: 100%; aspect-ratio: 16/9; }
  #msg { font-size: 20px; text-align: center; min-height: 32px; margin-top: 12px; font-weight: 600; }
  .ok { color: #16a34a; }
  .bad { color: #dc2626; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  .pop { animation: pop .5s; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
  .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 99; animation: fall 1.6s linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .6; } }
  #lock { display: none; text-align: center; }
  #lock h2 { color: #dc2626; }
  .hidden { display: none; }
  .hint { color: #6b7280; font-size: 14px; margin-top: 8px; }

  /* ===== CASINHAS DE LETRAS ===== */
  .slotwrap { position: relative; margin-top: 8px; min-height: 60px; }
  .slotwrap input[type=text] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0; }
  #slots { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 8px 0; }
  .word { display: flex; gap: 5px; }
  .slot { width: 24px; height: 36px; border-bottom: 3px solid #9ca3af; text-align: center; font-size: 24px; font-weight: 700; line-height: 34px; text-transform: uppercase; color: #1f2937; }
  .slot.cur { border-bottom-color: #4f46e5; animation: blink 1s infinite; }
  @keyframes blink { 50% { border-bottom-color: #c7d2fe; } }
</style>
</head>
<body>
<header>
  <h1>Typing Learning</h1>
  <div id="hearts"></div>
</header>

<main>
  <div class="card" id="lock">
    <h2>Seus corações acabaram</h2>
    <p>Você poderá jogar de novo em <b id="countdown"></b>.</p>
    <button onclick="buyPremium()">Vidas infinitas por R$ 34,90 (compra única)</button>
  </div>

  <div id="game">
    <div class="card">
      <input type="text" id="q" placeholder="Pesquise um vídeo ou música em inglês...">
      <button onclick="searchVideos()">Pesquisar</button>
      <div class="hint">
        Palavras por trecho:
        <select id="wpc">
          <option value="4">4</option>
          <option value="6" selected>6</option>
          <option value="8">8</option>
          <option value="10">10</option>
        </select>
      </div>
      <div class="hint">Dica: escolha vídeos que tenham legenda em inglês.</div>
      <div id="results"></div>
    </div>

    <div class="card hidden" id="playCard">
      <div id="player"></div>
      <div id="msg"></div>
      <div id="typeBox" class="hidden">
        <div class="slotwrap">
          <div id="slots"></div>
          <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="hint">Digite só as letras, sem espaço. Toque nos tracinhos se o teclado não abrir.</div>
        <button onclick="checkAnswer()">Enviar</button>
        <button class="sec" onclick="playChunk()">Ouvir de novo</button>
      </div>
    </div>
  </div>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const TRANSCRIPT_API = '/api/transcript?videoId=';
const MAX_LIVES = 5, LOCK_HOURS = 4;

let player, transcript = [], chunks = [], chunkIndex = 0, watcher = null, expectedWords = [];
let lives = parseInt(localStorage.getItem('lives') ?? MAX_LIVES);
const isPremium = () => localStorage.getItem('premium') === '1';

function renderHearts() {
  const el = document.getElementById('hearts');
  if (isPremium()) { el.textContent = '❤️ ∞'; return; }
  const l = Math.max(lives, 0);
  el.textContent = '❤️'.repeat(l) + '🖤'.repeat(MAX_LIVES - l);
}
function checkLock() {
  const until = parseInt(localStorage.getItem('lockUntil') || 0);
  if (!isPremium() && until > Date.now()) {
    document.getElementById('lock').style.display = 'block';
    document.getElementById('game').classList.add('hidden');
    const tick = () => {
      const left = until - Date.now();
      if (left <= 0) { unlock(); return; }
      const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
      document.getElementById('countdown').textContent = h + 'h ' + m + 'min ' + s + 's';
      setTimeout(tick, 1000);
    };
    tick();
    return true;
  }
  if (until && until <= Date.now()) unlock();
  return false;
}
function unlock() {
  localStorage.removeItem('lockUntil');
  localStorage.setItem('lives', MAX_LIVES);
  location.reload();
}
function loseLife() {
  if (isPremium()) return;
  lives--; localStorage.setItem('lives', lives); renderHearts();
  if (lives <= 0) {
    localStorage.setItem('lockUntil', Date.now() + LOCK_HOURS * 3600000);
    clearInterval(watcher);
    if (player && player.pauseVideo) player.pauseVideo();
    checkLock();
  }
}
function buyPremium() {
  if (confirm('Simulação: confirmar compra de R$ 34,90?')) {
    localStorage.setItem('premium', '1');
    localStorage.removeItem('lockUntil');
    location.reload();
  }
}

async function searchVideos() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const box = document.getElementById('results');
  if (typeof YT_API_KEY === 'undefined') { box.innerHTML = 'Falta o arquivo config.js com a chave do Google.'; return; }
  const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q=' + encodeURIComponent(q) + '&key=' + YT_API_KEY;
  box.innerHTML = 'Pesquisando...';
  try {
    const res = await fetch(url);
    const data = await res.json();
    box.innerHTML = '';
    if (data.error) { box.innerHTML = 'Erro na busca: ' + data.error.message; return; }
    (data.items || []).forEach(v => {
      const d = document.createElement('div');
      d.className = 'result';
      d.innerHTML = '<img src="' + v.snippet.thumbnails.default.url + '"><div>' + v.snippet.title + '</div>';
      d.onclick = () => chooseVideo(v.id.videoId);
      box.appendChild(d);
    });
  } catch (e) { box.innerHTML = 'Erro de conexão.'; }
}

/* ===== TRECHOS POR QUANTIDADE DE PALAVRAS ===== */
function buildChunks(n) {
  const words = [];
  transcript.forEach((c, idx) => {
    const w = c.text.split(' ').filter(Boolean);
    if (!w.length) return;
    let d = c.dur;
    const next = transcript[idx + 1];
    if (next && next.start > c.start) d = Math.min(d, next.start - c.start);
    if (!(d > 0)) d = 1;
    w.forEach((word, i) => words.push({
      word: word,
      start: c.start + (i / w.length) * d,
      end: c.start + ((i + 1) / w.length) * d
    }));
  });
  chunks = [];
  for (let i = 0; i < words.length; i += n) {
    const g = words.slice(i, i + n);
    const text = g.map(x => x.word).join(' ');
    if (g.length < 3 && chunks.length) {
      const p = chunks[chunks.length - 1];
      p.text += ' ' + text;
      p.end = g[g.length - 1].end;
      continue;
    }
    chunks.push({ start: g[0].start, end: g[g.length - 1].end, text: text });
  }
}

async function chooseVideo(id) {
  clearInterval(watcher);
  document.getElementById('playCard').classList.remove('hidden');
  document.getElementById('typeBox').classList.add('hidden');
  setMsg('Carregando transcrição...', '');
  try {
    const res = await fetch(TRANSCRIPT_API + id);
    transcript = await res.json();
  } catch (e) { transcript = []; }
  if (!transcript.length) { setMsg('Este vídeo não tem transcrição em inglês disponível. Escolha outro.', 'bad'); return; }
  buildChunks(parseInt(document.getElementById('wpc').value));
  if (!chunks.length) { setMsg('Não deu para montar os trechos deste vídeo. Escolha outro.', 'bad'); return; }
  chunkIndex = 0;
  document.getElementById('player').outerHTML = '<div id="player"></div>';
  player = new YT.Player('player', {
    videoId: id,
    playerVars: { controls: 0, rel: 0 },
    events: { onReady: () => playChunk() }
  });
}

function playChunk() {
  clearInterval(watcher);
  if (chunkIndex >= chunks.length) {
    setMsg('Fim do vídeo! 🎉', 'ok');
    document.getElementById('typeBox').classList.add('hidden');
    return;
  }
  const ch = chunks[chunkIndex];
  document.getElementById('typeBox').classList.add('hidden');
  setMsg('', '');
  player.seekTo(Math.max(ch.start - 0.3, 0), true);
  player.playVideo();
  const t0 = Date.now();
  watcher = setInterval(() => {
    if (Date.now() - t0 > 700 && player.getCurrentTime() >= ch.end + 0.3) {
      clearInterval(watcher);
      player.pauseVideo();
      document.getElementById('typeBox').classList.remove('hidden');
      setupSlots(ch.text);
    }
  }, 150);
}

/* ===== CASINHAS DE LETRAS ===== */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’‘`]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function setupSlots(text) {
  expectedWords = norm(text).split(' ').filter(Boolean);
  const a = document.getElementById('answer');
  a.value = '';
  renderSlots();
  a.focus();
}
function renderSlots() {
  const typed = document.getElementById('answer').value;
  let k = 0, html = '';
  expectedWords.forEach(w => {
    html += '<div class="word">';
    for (let i = 0; i < w.length; i++) {
      const c = typed[k] || '';
      html += '<div class="slot' + (k === typed.length ? ' cur' : '') + '">' + c + '</div>';
      k++;
    }
    html += '</div>';
  });
  document.getElementById('slots').innerHTML = html;
}
document.getElementById('answer').addEventListener('input', e => {
  const total = expectedWords.join('').length;
  e.target.value = e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '').slice(0, total);
  renderSlots();
});

/* ===== CONFERÊNCIA ===== */
function checkAnswer() {
  const ch = chunks[chunkIndex];
  const typed = document.getElementById('answer').value;
  const expected = expectedWords.join('');
  document.getElementById('typeBox').classList.add('hidden');
  if (typed === expected) {
    setMsg('Congratulations! 🎉', 'ok');
    const m = document.getElementById('msg'); m.classList.add('pop'); confetti();
    chunkIndex++;
    setTimeout(() => { m.classList.remove('pop'); playChunk(); }, 1800);
  } else {
    setMsg('Errou! O correto era: ' + ch.text, 'bad');
    const c = document.getElementById('playCard'); c.classList.add('shake');
    setTimeout(() => c.classList.remove('shake'), 400);
    loseLife();
    chunkIndex++;
    setTimeout(() => { if (!checkLock()) playChunk(); }, 3500);
  }
}
function setMsg(t, cls) { const m = document.getElementById('msg'); m.textContent = t; m.className = cls; }
function confetti() {
  const colors = ['#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('typeBox').classList.contains('hidden')) checkAnswer(); });

renderHearts();
checkLock();
</script>
</body>
</html>
